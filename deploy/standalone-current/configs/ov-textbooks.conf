{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "dev",
    "cors_origins": [
      "*"
    ]
  },
  "storage": {
    "workspace": "<DATA_DIR>/data-textbooks-2048",
    "vectordb": {
      "name": "context",
      "backend": "local",
      "project": "default"
    },
    "agfs": {
      "backend": "local",
      "timeout": 10
    }
  },
  "embedding": {
    "dense": {
      "provider": "volcengine",
      "api_base": "https://ark.cn-beijing.volces.com/api/plan/v3",
      "api_key": "<REDACTED>",
      "model": "doubao-embedding-vision",
      "dimension": 2048,
      "input": "text",
      "batch_size": 16
    },
    "max_concurrent": 1,
    "text_source": "content_only",
    "max_input_tokens": 4096,
    "allow_metadata_override": true,
    "max_retries": 5
  },
  "vlm": {
    "provider": "volcengine",
    "model": "doubao-seed-2-0-lite-260428",
    "api_key": "<REDACTED>",
    "api_base": "https://ark.cn-beijing.volces.com/api/plan/v3",
    "temperature": 1.0,
    "max_retries": 2,
    "max_concurrent": 2,
    "timeout": 30
  },
  "retrieval": {
    "hotness_alpha": 0.0,
    "score_propagation_alpha": 0.7
  },
  "parsers": {
    "markdown": {
      "max_section_size": 4096,
      "max_section_chars": 13000,
      "section_size_flexibility": 0.3
    }
  },
  "auto_generate_l0": true,
  "auto_generate_l1": true,
  "output_language_override": "zh-CN",
  "default_search_mode": "thinking",
  "default_search_limit": 3,
  "memory": {
    "version": "v2",
    "extraction_enabled": false,
    "session_skill_extraction_enabled": false
  },
  "log": {
    "level": "INFO",
    "format": "%(asctime)s - %(name)s - %(levelname)s - %(message)s",
    "output": "stdout"
  }
}
